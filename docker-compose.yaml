version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-myapp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Next.js Application
  cms:
    container_name: cms
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_FOLDER: ${NEXT_PUBLIC_CLOUDINARY_UPLOAD_FOLDER}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-myapp}?schema=public
    volumes:
      # Mount source code for hot-reload
      - .:/cms
      - /cms/node_modules
      - /cms/.next
      - /cms/prisma/generated
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    command: >
      sh -c "
        echo '🔄 Generating Prisma Client...' &&
        npx prisma generate &&
        echo '🔄 Running migrations...' &&
        npx prisma migrate deploy &&
        echo '🌱 Seeding database...' &&
        npx prisma db seed &&
        echo '✅ Database ready!' &&
        echo '🚀 Starting development server...' &&
        npm run dev
      "

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
