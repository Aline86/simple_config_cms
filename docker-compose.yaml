services:
  app:
    image: node:20
    container_name: next_app
    working_dir: /app
    volumes:
      - ./:/app
      - /node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:test@db:5432/mydb
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install && npx prisma generate && npm run dev"
    depends_on:
      - db

  db:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
